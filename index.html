shell:'<path d="M17 72Q15 24 60 20Q105 24 103 72L60 92Z" fill="#e7b7a7" stroke="#c68f85" stroke-width="4"/><path d="M60 23V88M42 29L53 86M79 29L67 86M25 50L49 86M95 50L71 86" stroke="#f8e3ce" stroke-width="4" fill="none"/>'};return start+(shapes[id]||shapes.plant)+end}
function goHome(){active=null;parent=false;render()}function enter(id){active=id;tab='decorate';selected=null;render()}function resetDay(){const d=data();if(d.lastDay!==today()){d.lastDay=today();d.daily={};save()}}function layout(){let k=kid(),d=data();return `<div class="top"><button onclick="goHome()">← Village</button><h1>${k.name}'s ${k.label}</h1><span class="pill">✦ ${d.stars} stars</span></div><div class="tabs"><button class="${tab==='decorate'?'active':''}" onclick="setTab('decorate')">🏡 Decorate</button><button class="${tab==='quests'?'active':''}" onclick="setTab('quests')">✓ Quests</button><button class="${tab==='shop'?'active':''}" onclick="setTab('shop')">🛍 Shop</button></div><div id="content"></div>`}function setTab(t){tab=t;selected=null;render()}
function render(){const app=$('app');if(!active){app.innerHTML=`<div class="top"><h1>🌷 Little Living</h1><button onclick="parentOpen()">⚙ Parent</button></div><div class="hero"></div><div class="panel center"><h2>Who is playing today?</h2><p class="muted">Choose your character to visit your little world.</p><div class="profiles">${KIDS.map(k=>`<button class="profile" onclick="enter('${k.id}')"><img class="portrait" src="${k.id}-portrait.png" alt="${k.name} character"><b>${k.name}</b><small>${k.label}</small></button>`).join('')}</div></div><p class="center muted">Little moments in real life make your world grow. ♡</p>`;return}resetDay();app.innerHTML=layout();if(tab==='decorate')renderDecor();else if(tab==='quests')renderQuests();else renderShop()}
function renderDecor(){const k=kid(),d=data();d.inventory=d.inventory||[];$('content').innerHTML=`<div class="panel"><h2>${k.label}</h2><p class="muted">Drag furniture to decorate your storybook world.</p><div id="scene" class="scene ${k.world}">${d.items.map((it,i)=>`<div class="decor ${selected===i?'selected':''}" data-i="${i}" style="left:${it.x}%;top:${it.y}%;z-index:${i+1}">${itemArt(it.id)}</div>`).join('')}</div><p class="scene-note">Drag to move · Tap to select · Your layout saves automatically</p><div class="row spread"><button onclick="setTab('shop')">＋ Furniture Shop</button><button ${selected===null?'disabled':''} onclick="putAway()">Store selected</button></div></div><div class="panel"><h3>My Furniture</h3><p class="muted">Furniture you store stays yours. Place it again for free!</p><div class="shop">${d.inventory.map((id,i)=>{const c=CATALOG.find(c=>c.id===id);return c?`<div class="item">${itemArt(id)}<b>${c.name}</b><button class="primary" onclick="placeOwned('${id}')">Place for free</button></div>`:''}).join('')||'<p class="muted">Stored furniture will appear here.</p>'}</div></div>`;setupDrag()}
function setupDrag(){const scene=$('scene');scene.querySelectorAll('.decor').forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();const i=+el.dataset.i;selected=i;scene.querySelectorAll('.decor').forEach(n=>n.classList.remove('selected'));el.classList.add('selected');const rect=scene.getBoundingClientRect();const er=el.getBoundingClientRect();drag={i,offX:e.clientX-er.left,offY:e.clientY-er.top,rect,el};el.setPointerCapture(e.pointerId);const btn=document.querySelector('button[onclick="putAway()"]');if(btn)btn.disabled=false});el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el)return;const x=Math.max(0,Math.min(81,((e.clientX-drag.rect.left-drag.offX)/drag.rect.width)*100));const y=Math.max(0,Math.min(71,((e.clientY-drag.rect.top-drag.offY)/drag.rect.height)*100));el.style.left=x+'%';el.style.top=y+'%';data().items[drag.i].x=+x.toFixed(1);data().items[drag.i].y=+y.toFixed(1)});el.addEventListener('pointerup',()=>{if(drag){save();drag=null}});el.addEventListener('pointercancel',()=>{save();drag=null})})}function putAway(){if(selected===null)return;const d=data(),it=d.items.splice(selected,1)[0];d.inventory=d.inventory||[];d.inventory.push(it.id);selected=null;save();render();toast('Stored in My Furniture ♡')}function duplicate(id){placeOwned(id)}function placeOwned(id){const d=data();d.inventory=d.inventory||[];const i=d.inventory.indexOf(id);if(i<0){toast('Buy this item first!');return}d.inventory.splice(i,1);d.items.push({id,x:35,y:45});save();selected=d.items.length-1;render();toast('Drag your furniture to its new spot ♡')}
let shopCategory='All';
function shopGroups(){const ids=CATALOG.filter(c=>c.world===kid().world);return ['All',...new Set(ids.map(c=>c.base||c.id))]}
function shopGroupLabel(v){return v==='All'?'All':({bed:'Beds',shelf:'Bookcases',chair:'Chairs',rug:'Rugs',lamp:'Lamps',plant:'Plants',tree:'Trees',flowers:'Flowers',bench:'Benches',mushroom:'Mushrooms',fish:'Fish',lily:'Lilies',coral:'Water Plants',shell:'Shells'}[v]||v)}
function chooseCategory(c){shopCategory=c;renderShop()}
function showItem(id){const c=CATALOG.find(x=>x.id===id);if(!c)return;const m=document.createElement('div');m.className='shop-modal-backdrop';m.id='shop-preview';m.innerHTML='<div class="shop-modal" role="dialog" aria-modal="true" aria-label="Furniture preview"><div class="row spread"><h2>'+c.name+'</h2><button aria-label="Close preview" onclick="closeItem()">✕</button></div>'+itemArt(id)+'<p class="center">✦ '+c.price+' stars</p><p class="center muted">Preview your furniture, then buy and place it in your world.</p><div class="row"><button onclick="closeItem()">Back</button><button class="primary" '+(data().stars<c.price?'disabled':'')+' onclick="closeItem();buy(\''+id+'\')">Buy & Place</button></div></div>';m.addEventListener('click',e=>{if(e.target===m)closeItem()});document.body.appendChild(m)}
function closeItem(){const m=document.getElementById('shop-preview');if(m)m.remove()}
function renderShop(){const k=kid();const items=CATALOG.filter(c=>c.world===k.world);const shown=items.filter(c=>shopCategory==='All'||(c.base||c.id)===shopCategory);$('content').innerHTML=`<div class="panel"><h2>${k.name}'s Furniture Shop</h2><p class="muted">Tap any item to see a larger preview. Buy it with stars and drag it into your world.</p><div class="shop-filter">${shopGroups().map(g=>`<button class="${shopCategory===g?'active':''}" onclick="chooseCategory('${g}')">${shopGroupLabel(g)}</button>`).join('')}</div><div class="shop">${shown.map(c=>`<div class="item"><button style="padding:0;border:0;box-shadow:none;background:transparent;width:100%" onclick="showItem('${c.id}')" aria-label="Preview ${c.name}">${itemArt(c.id)}</button><b>${c.name}</b><div class="item-info">✦ ${c.price} stars</div><button class="primary" ${data().stars<c.price?'disabled':''} onclick="buy('${c.id}')">Buy & Place</button></div>`).join('')}</div></div>`}
function buy(id){const c=CATALOG.find(c=>c.id===id),d=data();if(!c)return;if(d.stars<c.price){toast('Not enough stars yet!');return}d.stars-=c.price;d.inventory=d.inventory||[];d.inventory.push(id);save();tab='decorate';selected=null;render();toast('Purchased! Find it in My Furniture ♡')}
function renderQuests(){const d=data(),extra=state.special||[];$('content').innerHTML=`<div class="panel"><h2>Today's Little Quests</h2><p class="muted">Do your quests away from the screen. Come back to check them off together!</p><h3>Everyday quests · Check yourself</h3>${DAILY.map((q,i)=>`<div class="task ${d.daily[i]?'is-done':''}"><div><b>${q[0]}</b><small>✦ ${q[1]} stars</small></div><input class="quest-check" type="checkbox" aria-label="Complete ${q[0]}" ${d.daily[i]?'checked disabled':''} onchange="dailyDone(${i})"></div>`).join('')}<h3 style="margin-top:24px">Special quests · Parent approval</h3>${[...SPECIAL,...extra].map((q,i)=>`<div class="task ${d.special[i]==='approved'?'is-done':''}"><div><b>${q[0]}</b><small>✦ ${q[1]} stars · ${d.special[i]==='approved'?'Approved':d.special[i]==='pending'?'Waiting for parent':'Parent approval required'}</small></div><input class="quest-check" type="checkbox" aria-label="Request parent approval for ${q[0]}" ${d.special[i]==='approved'?'checked disabled':d.special[i]==='pending'?'disabled':''} onchange="requestSpecial(${i})"></div>`).join('')}</div>`}function dailyDone(i){const d=data();if(d.daily[i])return;d.daily[i]=true;d.stars+=DAILY[i][1];save();render();toast('Great job! Stars earned ✨')}function requestSpecial(i){data().special[i]='pending';save();render();toast('Ask Mom or Dad to approve this quest!')}
function parentOpen(){const pin=prompt('Parent PIN');if(pin===null)return;if(pin!==state.pin){alert('Incorrect PIN');return}parent=true;renderParent()}function renderParent(){active=null;const pending=KIDS.flatMap(k=>Object.entries(state.kids[k.id].special).filter(([i,v])=>v==='pending').map(([i])=>({id:k.id,i:+i,name:k.name,task:[...SPECIAL,...state.special][+i]})));$('app').innerHTML=`<div class="top"><button onclick="goHome()">← Village</button><h1>Parent Corner</h1></div><div class="panel"><h2>Special Quest Approvals</h2>${pending.map(p=>`<div class="task"><div><b>${p.name}: ${p.task?.[0]||'Quest'}</b><small>✦ ${p.task?.[1]||20} stars</small></div><div class="row"><button class="primary" onclick="approve('${p.id}',${p.i})">Approve</button><button onclick="reject('${p.id}',${p.i})">Decline</button></div></div>`).join('')||'<p class="muted">No quests waiting for approval.</p>'}</div><div class="panel"><h2>Add a Family Quest</h2><div class="stack"><input id="newTask" placeholder="e.g. Ask Grandma about her favorite book" maxlength="120"><div class="row"><label>Stars <input id="newStars" type="number" min="1" max="100" value="20" style="width:90px"></label><button class="primary" onclick="addQuest()">Add special quest</button></div></div><h3 style="margin-top:16px">Custom quests</h3>${state.special.map((q,i)=>`<div class="task"><span>${q[0]} · ✦ ${q[1]}</span><button onclick="removeQuest(${i})">Remove</button></div>`).join('')||'<p class="muted">None yet.</p>'}</div><div class="panel"><h2>Parent PIN</h2><div class="row"><input id="pinChange" type="password" placeholder="New PIN" maxlength="20"><button onclick="changePin()">Change PIN</button></div><p class="muted">Prototype only: PIN and data are stored in this browser, not securely on a server.</p></div>`}
function approve(id,i){const d=state.kids[id];if(d.special[i]!=='pending')return;d.special[i]='approved';d.stars+=([...SPECIAL,...state.special][i]||['',20])[1];save();renderParent();toast('Quest approved! Stars awarded.')}function reject(id,i){delete state.kids[id].special[i];save();renderParent()}function addQuest(){const name=$('newTask').value.trim(),stars=Math.min(100,Math.max(1,Number($('newStars').value)||20));if(!name)return;state.special.push([name,stars]);save();renderParent()}function removeQuest(i){if(!confirm('Remove this quest?'))return;state.special.splice(i,1);for(const k of KIDS){state.kids[k.id].special={}}save();renderParent()}function changePin(){const p=$('pinChange').value;if(p.length<4){alert('Use at least 4 characters');return}state.pin=p;save();toast('PIN changed')}
render();
</script></body></html>
